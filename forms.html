<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2>Student Registration Form</h2>
    <form action="#" method="POST">
        
  
        <div class="form-group">
            <label for="roll-no">Roll no. :</label>
            <input type="text" id="roll-no" name="roll_no">
        </div>

        <div class="form-group">
            <label>Student name :</label>
            <div class="name-fields">
                <input type="text" name="first_name" placeholder="First Name">
                <input type="text" name="last_name" placeholder="Last Name">
            </div>
        </div>

        <div class="form-group">
            <label for="father-name">Father's name :</label>
            <input type="text" id="father-name" name="father_name">
        </div>

        <div class="form-group">
            <label>Date of birth :</label>
            <div class="dob-fields">
                <select name="dob_day">
                    <option value="">Day</option>
                </select>
                <select name="dob_month">
                    <option value="">Month</option>
                </select>
                <select name="dob_year">
                    <option value="">Year</option>
                </select>
                <span class="dob-hint">(DD-MM-YYYY)</span>
            </div>
        </div>

        <div class="form-group">
            <label>Mobile no. :</label>
            <div class="mobile-fields">
                <input type="text" value="+91" readonly>
                <input type="text" name="mobile_no">
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email id :</label>
            <input type="email" id="email" name="email_id">
        </div>

        <div class="form-group">
            <label for="password">Password :</label>
            <input type="password" id="password" name="password">
        </div>

        <div class="form-group">
            <label>Gender :</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>
        </div>

        <div class="form-group">
            <label>Department :</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="dept" value="CSE"> CSE</label>
                <label><input type="checkbox" name="dept" value="IT"> IT</label>
                <label><input type="checkbox" name="dept" value="ECE"> ECE</label>
                <label><input type="checkbox" name="dept" value="Civil"> Civil</label>
                <label><input type="checkbox" name="dept" value="Mech"> Mech</label>
            </div>
        </div>

        <div class="form-group">
            <label for="course">Course :</label>
            <select id="course" name="course">
                <option value="" selected disabled>--------- Select Current Course's ---------</option>
                <option value="btech">B.Tech</option>
                <option value="mtech">M.Tech</option>
                <option value="bca">BCA</option>
            </select>
        </div>

        <div class="form-group">
            <label for="photo">Student photo :</label>
            <input type="file" id="photo" name="student_photo">
        </div>

        <div class="form-group">
            <label for="city">City :</label>
            <input type="text" id="city" name="city">
        </div>

        <div class="form-group">
            <label for="address">Address :</label>
            <textarea id="address" name="address"></textarea>
        </div>

        <div class="btn-container">
            <button type="submit" class="submit-btn">Register</button>
        </div>

    </form>
</div>

</body>
</html>
